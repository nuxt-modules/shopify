name: "🚀 Feature request"
description: Suggest a feature that will improve the Nuxt Shopify module
labels: ["pending triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this feature request!

        Please carefully read the contribution docs before suggesting a new feature
        👉 https://github.com/nuxt-modules/shopify/blob/main/.github/CONTRIBUTING.md
  - type: textarea
    id: feature-description
    attributes:
      label: Describe the feature
      description: A clear and concise description of what you think would be a helpful addition to the module, including the possible use cases and alternatives you have considered. If you have a working prototype, please include a link.
      placeholder: Feature description
    validations:
      required: true
  - type: checkboxes
    id: additional-info
    attributes:
      label: Additional information
      description: Additional information that helps us decide how to proceed.
      options:
        - label: Would you be willing to help implement this feature?
        - label: Could this feature be implemented in userland instead?
  - type: checkboxes
    id: required-info
    attributes:
      label: Final checks
      description: Before submitting, please make sure you do the following
      options:
        - label: Read the [contribution guide](https://github.com/nuxt-modules/shopify/blob/main/.github/CONTRIBUTING.md).
          required: true
        - label: Check the [documentation](https://shopify.nuxtjs.org) and existing [issues](https://github.com/nuxt-modules/shopify/issues).
          required: true
