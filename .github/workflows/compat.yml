name: "Compatibility"

env:
  NUXT_SHOPIFY_NAME: ${{ secrets.NUXT_SHOPIFY_NAME }}

  NUXT_SHOPIFY_CLIENTS_STOREFRONT_API_VERSION: ${{ secrets.NUXT_SHOPIFY_CLIENTS_STOREFRONT_API_VERSION }}
  NUXT_SHOPIFY_CLIENTS_STOREFRONT_PUBLIC_ACCESS_TOKEN: ${{ secrets.NUXT_SHOPIFY_CLIENTS_STOREFRONT_PUBLIC_ACCESS_TOKEN }}

  NUXT_SHOPIFY_CLIENTS_ADMIN_API_VERSION: ${{ secrets.NUXT_SHOPIFY_CLIENTS_ADMIN_API_VERSION }}
  NUXT_SHOPIFY_CLIENTS_ADMIN_CLIENT_ID: ${{ secrets.NUXT_SHOPIFY_CLIENTS_ADMIN_CLIENT_ID }}
  NUXT_SHOPIFY_CLIENTS_ADMIN_CLIENT_SECRET: ${{ secrets.NUXT_SHOPIFY_CLIENTS_ADMIN_CLIENT_SECRET }}

  NUXT_SHOPIFY_CLIENTS_CUSTOMER_ACCOUNT_API_VERSION: ${{ secrets.NUXT_SHOPIFY_CLIENTS_CUSTOMER_ACCOUNT_API_VERSION }}
  NUXT_SHOPIFY_CLIENTS_CUSTOMER_ACCOUNT_CLIENT_ID: ${{ secrets.NUXT_SHOPIFY_CLIENTS_CUSTOMER_ACCOUNT_CLIENT_ID }}
  NUXT_SHOPIFY_CLIENTS_CUSTOMER_ACCOUNT_SESSION_PASSWORD: ${{ secrets.NUXT_SHOPIFY_CLIENTS_CUSTOMER_ACCOUNT_SESSION_PASSWORD }}

on:
  schedule:
    - cron: "0 4 * * 1"

  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: "node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 24.11.0, 26.0.0]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm run prepare && pnpm run test

  hydrogen:
    name: "hydrogen ${{ matrix.hydrogen }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hydrogen:
          - "2026.10.3"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Pin hydrogen peers
        run: pnpm add -D -w "@shopify/hydrogen@${{ matrix.hydrogen }}"

      - name: Run tests
        run: pnpm run prepare && pnpm run test

  windows:
    name: "windows"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build module package
        run: pnpm run prepare

      - name: Build playground
        run: pnpm --filter playground-v4-mock build
        env:
          NUXT_SHOPIFY_NAME: mock

      - name: Build template
        run: pnpm run build:template
